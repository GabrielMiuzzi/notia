               L473 509 Z"/>

      <path class="logo" d="M371 508 L423 556 L415 565 L371 517 Z"/>
      <path class="logo" d="M653 508 L601 556 L609 565 L653 517 Z"/>
      <path class="logo" d="M449 583 L483 619 L474 619 L449 592 Z"/>
      <path class="logo" d="M575 583 L541 619 L550 619 L575 592 Z"/>

      <path class="logo"
            d="M340 428
               L334 420
               L324 417
               L309 430
               L250 430
               L250 436
               L309 436
               L316 446
               L328 448
               L338 441 Z"/>

      <path class="logo"
            d="M683 427
               L684 439
               L694 447
               L707 445
               L714 435
               L774 434
               L773 429
               L714 429
               L702 417
               L691 418 Z"/>
    </g>

    <g class="flickerB">
      <circle class="ring" cx="324" cy="432" r="15"/>
      <circle class="ring" cx="700" cy="432" r="15"/>
      <circle class="ring" cx="400" cy="307" r="13"/>
      <circle class="ring" cx="625" cy="307" r="13"/>
    </g>
  </g>
</svg>