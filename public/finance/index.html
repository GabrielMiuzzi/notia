<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finanzas personales</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10131a; color: #f4f6fb; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: clamp(24px, 5vw, 72px); background: radial-gradient(circle at top right, #1e2c48, #10131a 55%); }
      main { max-width: 880px; margin: auto; }
      .eyebrow { color: #9bbcff; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 12px 0; font-size: clamp(2rem, 5vw, 3.5rem); }
      p { color: #b8c1d1; line-height: 1.6; }
      .card { margin-top: 32px; padding: 24px; border: 1px solid #2d3b56; border-radius: 18px; background: #171c27; }
      .card strong { display: block; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">Notia · Finanzas</div>
      <h1>Finanzas personales</h1>
      <p>Este espacio queda preparado para implementar el módulo de finanzas personales.</p>
      <section class="card" aria-label="Estado del módulo">
        <strong>Módulo en preparación</strong>
        <p>Acá vamos a incorporar ingresos, gastos, presupuestos y evolución del patrimonio.</p>
      </section>
    </main>
  </body>
</html>
