[package]
name = "notia"
version = "1.0.12"
description = "Notia desktop app"
authors = ["Gabriel"]
edition = "2021"

[lib]
name = "notia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream"] }
ogg = "0.9.2"
ropus = "0.12.18"
anyhow = "1"
hound = "3.5"
ndarray = { version = "0.16", features = ["rayon"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "half", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
regex = "1.10"
unicode-normalization = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
lru = "0.12"
cpal = "0.16"
libloading = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
btleplug = "0.11.7"
env_logger = "0.11"
futures = "0.3"
notify = "6.1.1"
tokio = { version = "1", features = ["time", "rt"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.16"
libloading = "0.8"
tauri = { version = "2", features = ["tray-icon"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
