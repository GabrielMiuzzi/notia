[package]
name = "notia"
version = "1.0.12"
description = "Notia desktop app"
authors = ["Gabriel"]
edition = "2021"

[workspace]
members = ["backend-core", "app"]

[lib]
name = "notia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["app"]
# The window (Tauri). Without it the executable only runs `--headless`,
# which is how Linux servers build it: `--no-default-features`.
app = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-build", "notia-app/bluetooth"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
notia-app = { path = "app" }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Model files are verified with SHA-256 before loading; unoptimized, hashing
# the speech models takes tens of seconds in development builds.
[profile.dev.package.sha2]
opt-level = 3
