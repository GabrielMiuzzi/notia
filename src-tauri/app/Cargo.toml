[package]
name = "notia-app"
version = "0.1.0"
description = "Notia application layer: use cases, state, adapters and command dispatch, without Tauri"
edition = "2021"

[lib]
name = "notia_app"

[features]
# ColdPass Bluetooth link (btleplug). Local-only: the window enables it; a
# headless server does not need it (and on Linux it would require libdbus).
bluetooth = ["dep:btleplug"]

[dependencies]
notia-backend-core = { path = "../backend-core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
sha2 = "0.10"
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "stream", "multipart"] }
ogg = "0.9.2"
ropus = "0.12.18"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
hound = "3.5"
ndarray = { version = "0.16", features = ["rayon"] }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "half", "load-dynamic"] }
ort-sys = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic"] }
rand = "0.8"
rand_distr = "0.4"
rayon = "1.10"
regex = "1.10"
unicode-normalization = "0.1"
tokio = { version = "1", features = ["time", "rt", "rt-multi-thread"] }
lopdf = "0.38"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = "0.4"
# Native speech runtimes (Qwen3-ASR/TTS) are loaded at run time.
libloading = "0.8"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"
lru = "0.12"
cpal = "0.16"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
aes = "0.8"
btleplug = { version = "0.11.7", optional = true }
cbc = "0.1"
env_logger = "0.11"
futures = "0.3"
notify = "6.1.1"
rcgen = "0.13"
rustls = "0.23"
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.16"
ipconfig = "0.3"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Console",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_Storage_FileSystem",
] }
