[package]
name = "notia-backend-core"
version = "0.1.0"
description = "Tauri-independent backend core for Notia"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1.10"
# Markdown exports: the note is parsed, laid out and written as PDF or DOCX.
pulldown-cmark = { version = "0.13", default-features = false }
pdf-writer = "0.12"
subsetter = { version = "0.2", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
miniz_oxide = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
lopdf = "0.38"
quick-xml = "0.38"
